<!doctype html>
<!--
  App HTML Shell
  The single page every Salin URL loads. React mounts into #root; the PWA
  build adds the web app manifest link and caches this file for offline use.
-->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F8FAF9" />
  <meta name="description" content="Salin AI — turn documents into structured data, on your device." />
  <title>Salin AI</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
