<!doctype html>
<!--
  App HTML Shell
  The single page every Salin URL loads. React mounts into #root; the PWA
  build adds the web app manifest link and caches this file for offline use.
  A tiny inline script applies the saved theme before the first paint.
-->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F8FAF9" />
  <meta name="description" content="Salin AI — turn documents into structured data, on your device." />
  <title>Salin AI</title>
  <!-- Apply the saved theme and density before first paint (see src/stores/appearance-store.ts). -->
  <script>
    try {
      var a = JSON.parse(localStorage.getItem("salin.appearance") || "{}");
      var dark = a.theme === "dark" || (a.theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      if (dark) document.documentElement.classList.add("dark");
      if (a.density === "compact") document.documentElement.dataset.density = "compact";
    } catch (e) {}
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
